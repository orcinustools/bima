# HAProxy behind Cloudflare (proxied DNS, orange cloud). Generated by
#   bima init --cloudflare-only --cloudflare-account <ACCOUNT_ID>
# haproxy.cfg: see examples/haproxy/behind-cloudflare.cfg.
# Secrets: BIMA_CLOUDFLARE_API_TOKEN (Account Filter Lists: Edit), BIMA_TELEGRAM_*
listen: "127.0.0.1:12345"
metrics_addr: "127.0.0.1:9101"
mode: enforce
host: www.example.com
cloudflare:
  trust_edge: true                # edge ranges trusted, client IP from CF-Connecting-IP, edge never banned
  edge_ips_file: /etc/haproxy/bima-cloudflare.lst   # same file as the HAProxy acl; refresh monthly:
                                  # bima cloudflare ips -fetch -o /etc/haproxy/bima-cloudflare.lst
  ban_sync:                       # Bima bans → Cloudflare IP list → blocked at the edge
    enabled: true
    account_id: "0123456789abcdef0123456789abcdef"
    list_name: bima_blocklist     # used by rule 1 of `bima cloudflare rules`
    interval: 30s
group:
  by: [asn]                       # the edge terminates TLS: no client JA3 at the origin
state: {backend: memory, ban_file: /var/lib/bima/bans.json}
geoip:
  asn_db: /usr/share/GeoIP/dbip-asn-lite.mmdb
ban:
  runtime_apis: ["unix:/var/run/haproxy/admin.sock"]
  map_file: /etc/haproxy/bima-blocklist.map
alert:
  telegram: {enabled: true}
