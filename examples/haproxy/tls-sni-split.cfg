# Port 443 is TLS passthrough (mode tcp) for most hostnames, but a few
# hostnames must be inspected by Bima. Those are split by SNI, terminated in a
# local HTTP frontend (abns socket) where Bima runs, and re-encrypted to the
# original upstream. Other hostnames keep passing through untouched.
global
    log stdout format raw local0 info
    stats socket /var/run/haproxy/admin.sock mode 660 level admin
    stats timeout 10s
    tune.bufsize 65536                # must match max-frame-size 65532 in bima-spoe.conf
    tune.ssl.capture-buffer-size 128

defaults
    log global
    timeout connect 5s
    timeout client 30s
    timeout server 60s
    timeout tarpit 5s

frontend fe_tls_in
    mode tcp
    bind :443
    tcp-request inspect-delay 2s
    tcp-request content accept if { req.ssl_hello_type 1 }
    use_backend be_bima_tls if { req.ssl_sni -i www.example.com api.example.com }
    default_backend be_passthrough

backend be_passthrough
    mode tcp
    server upstream 192.0.2.50:443

# hand the TLS connection to the local inspecting frontend, keeping the client address
backend be_bima_tls
    mode tcp
    server local abns@bima-tls send-proxy-v2

frontend fe_bima_tls
    mode http
    option httplog
    bind abns@bima-tls accept-proxy ssl crt /etc/haproxy/certs/ alpn h2,http/1.1
    option http-buffer-request
    unique-id-format %{+X}o\ %ci:%cp_%fi:%fp_%Ts_%rt:%pid
    unique-id-header X-Request-ID
    http-request deny deny_status 403 if { src,map_ip(/etc/haproxy/bima-blocklist.map) -m found }
    http-request deny deny_status 403 if { fc_src,map_ip(/etc/haproxy/bima-blocklist.map) -m found }
    http-request set-var(txn.path) path
    http-request set-var(txn.method) method
    filter spoe engine bima config /etc/haproxy/bima-spoe.conf
    http-request send-spoe-group bima check-request
    http-request deny deny_status 403 if { var(txn.bima.action) -m str block }
    http-request tarpit deny_status 429 if { var(txn.bima.action) -m str tarpit }
    http-response send-spoe-group bima check-response
    http-request del-header X-Forwarded-For       # inspected above; send a clean one upstream
    option forwardfor
    default_backend be_https_reencrypt

# re-encrypt to the original upstream, same SNI as the client asked for
backend be_https_reencrypt
    mode http
    server upstream 192.0.2.50:443 ssl verify none sni ssl_fc_sni

backend be_bima_agents
    mode tcp
    balance roundrobin
    timeout connect 1s
    timeout server 3m
    server bima1 127.0.0.1:12345 check inter 2s
