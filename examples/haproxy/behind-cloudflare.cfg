# Origin behind Cloudflare (generated by: bima init --cloudflare-only). Bima config: examples/config/05-behind-cloudflare.yaml
global
    log /dev/log local0 info
    stats socket /var/run/haproxy/admin.sock mode 660 level admin
    stats timeout 10s
    tune.bufsize 65536
    tune.ssl.capture-buffer-size 128

defaults
    mode http
    log global
    option httplog
    timeout connect 5s
    timeout client 30s
    timeout server 60s
    timeout tarpit 5s

frontend fe_web
    bind :80
    option http-buffer-request
    unique-id-format %{+X}o\ %ci:%cp_%fi:%fp_%Ts_%rt:%pid
    unique-id-header X-Request-ID
    # behind Cloudflare: real client IP from CF-Connecting-IP, only when the peer is a Cloudflare edge
    acl bima_cf_edge src -f /etc/haproxy/bima-cloudflare.lst
    http-request deny deny_status 403 if !bima_cf_edge      # origin lockdown: Cloudflare only
    http-request set-src req.hdr_ip(cf-connecting-ip) if bima_cf_edge { req.hdr(cf-connecting-ip) -m found }
    # L0: IPs banned by Bima never reach the agent
    http-request deny deny_status 403 if { src,map_ip(/etc/haproxy/bima-blocklist.map) -m found }
    http-request deny deny_status 403 if { fc_src,map_ip(/etc/haproxy/bima-blocklist.map) -m found }
    # L1-2: Bima via SPOE (fail-open on agent error/timeout)
    http-request set-var(txn.path) path
    http-request set-var(txn.method) method
    filter spoe engine bima config /etc/haproxy/bima-spoe.conf
    http-request send-spoe-group bima check-request
    http-request deny deny_status 403 if { var(txn.bima.action) -m str block }
    http-request tarpit deny_status 429 if { var(txn.bima.action) -m str tarpit }
    http-response send-spoe-group bima check-response
    default_backend be_app

frontend fe_stats
    bind 127.0.0.1:8404
    http-request use-service prometheus-exporter if { path /metrics }
    no log

backend be_app
    server app1 127.0.0.1:8000 check

backend be_bima_agents
    mode tcp
    balance roundrobin
    timeout connect 1s
    timeout server 3m
    server bima1 127.0.0.1:12345 check inter 2s
