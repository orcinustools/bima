global: {scrape_interval: 5s, evaluation_interval: 5s}
rule_files: [/etc/prometheus/rules/*.yml]
alerting:
  alertmanagers: [{static_configs: [{targets: ["alertmanager:9093"]}]}]
scrape_configs:
  - job_name: bima
    static_configs: [{targets: ["bima:9101", "bima2:9101"]}]
  - job_name: haproxy
    static_configs: [{targets: ["haproxy:8404", "haproxy2:8404"]}]
