listen: ":12345"
metrics_addr: ":9101"
mode: enforce                 # overridden by BIMA_MODE env (phase 5 shadow test)
host: e2e.bima.local
allowlist:
  - 10.200.0.0/16             # e.g. office / monitoring
max_body_inspect: 65536
crs:
  enabled: true
  paranoia: 1
  inbound_threshold: 5
score:
  tarpit: 50
  ban: 80
  half_life: 5m
  window: 1m
group:
  by: [asn, fingerprint]
  distinct_404: 60
  min_ips: 3
  member_404: 3
  penalty: 80
  flag_ttl: 2m
state:
  backend: redis              # both agents share scores, windows and bans
  redis:
    addr: redis:6379
    prefix: "bima:"
geoip:
  country_db: /usr/share/bima/geo/country.mmdb
  asn_db: /usr/share/bima/geo/asn.mmdb
ban:
  enabled: true
  runtime_apis: ["tcp:haproxy:9999", "tcp:haproxy2:9999"]
  map_file: /usr/local/etc/haproxy/bima-blocklist.map
  durations: [20s, 40s, 1m]   # short ladder for e2e (prod: 10m, 1h, 24h)
  reconcile_interval: 2s
alert:
  dedup_window: 30s
  digest_interval: 5s
  telegram:
    enabled: true
    api_base: "http://notify:8090"   # mock; prod: https://api.telegram.org
  discord:
    enabled: true
exclusions:
  # Developer snippets legitimately contain shell commands.
  - rules: ["BIMA-RCE-001", "BIMA-RCE-002", "CRS-932*"]
    path: "^/api/snippets$"
    locations: ["body"]
    reason: "code snippet feature"
  # --- learned from the shadow-mode report (phase 5) ---
  # Rich-text product description: HTML tags are expected. Only the generic
  # HTML-injection rule is excluded; <script>/event-handler XSS rules stay on.
  - rules: ["CRS-941160"]
    path: "^/api/products$"
    locations: ["body:json.description"]
    reason: "rich text editor"
  # Free-text search box: words like 'rm -rf', 'ls', 'C:\\Program Files'.
  # CRS command/file heuristics off for q; Bima's separator-based RCE/LFI rules stay on.
  - rules: ["CRS-932*", "CRS-930*"]
    path: "^/search$"
    locations: ["query:q"]
    reason: "free-text search"
  # GraphQL documents ({ field(arg: $var) { ... } }) look like shell to CRS 932.
  - rules: ["CRS-932*"]
    path: "^/graphql$"
    locations: ["body"]
    reason: "graphql endpoint"
  # Avatars sent as data URLs: "data:image/png;base64,..." reads as "; base64" to CRS 932.
  - rules: ["CRS-932*"]
    path: "^/api/profile$"
    locations: ["body:json.avatar"]
    reason: "data URL image field"
