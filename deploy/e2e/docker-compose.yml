name: bima-e2e
x-bima: &bima
  image: bima:e2e
  command: ["/usr/local/bin/bima", "-config", "${BIMA_CONFIG:-/etc/bima/config.yaml}"]
  volumes: ["./config.yaml:/etc/bima/config.yaml:ro", "./config.untuned.yaml:/etc/bima/config.untuned.yaml:ro"]
  depends_on: [redis]
  environment: &bima-env
    BIMA_MODE: ${BIMA_MODE:-enforce}
    BIMA_TELEGRAM_TOKEN: "123456:TEST-TOKEN"
    BIMA_TELEGRAM_CHAT_ID: "-1001234567890"
    BIMA_DISCORD_WEBHOOK: "http://notify:8090/discord/webhook"
    GOGC: "400"
    GOMEMLIMIT: "512MiB"
x-haproxy: &haproxy
  image: haproxy:3.0-alpine
  depends_on: [app]
  volumes:
    - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    - ../bima-spoe.conf:/usr/local/etc/haproxy/bima-spoe.conf:ro
    - ./bima-blocklist.map:/usr/local/etc/haproxy/bima-blocklist.map:ro
    - ./certs:/usr/local/etc/haproxy/certs:ro
services:
  app:
    image: bima:e2e
    command: ["/usr/local/bin/mockapp"]
  notify:
    image: bima:e2e
    command: ["/usr/local/bin/mocknotify"]
    environment: {RATE_LIMIT_FIRST: "1"}
    ports: ["127.0.0.1:18090:8090"]
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
  bima:
    <<: *bima
    build: {context: ../.., dockerfile: Dockerfile, target: e2e}
    ports: ["127.0.0.1:19101:9101"]
  bima2:
    <<: *bima
    ports: ["127.0.0.1:19102:9101"]
  haproxy:
    <<: *haproxy
    environment: {BIMA_AGENT: bima}
    ports: ["127.0.0.1:18080:8080", "127.0.0.1:18443:8443", "127.0.0.1:18081:8081", "127.0.0.1:19999:9999", "127.0.0.1:18404:8404"]
  haproxy2:
    <<: *haproxy
    environment: {BIMA_AGENT: bima2}
    ports: ["127.0.0.1:18082:8080", "127.0.0.1:19998:9999", "127.0.0.1:18405:8404"]
  prometheus:
    image: prom/prometheus:v3.5.0
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../monitoring/bima-rules.yml:/etc/prometheus/rules/bima-rules.yml:ro
    ports: ["127.0.0.1:19090:9090"]
  alertmanager:
    image: prom/alertmanager:v0.28.1
    volumes: ["./alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro"]
    ports: ["127.0.0.1:19093:9093"]
  grafana:
    image: grafana/grafana:11.6.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ../monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["127.0.0.1:13000:3000"]
