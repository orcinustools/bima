# SPOE config for Bima. Referenced by: filter spoe engine bima config <this file>
[bima]
spoe-agent bima-agent
    groups check-request check-response
    option var-prefix bima          # agent vars land in txn.bima.* (action, score, rule, fp)
    option set-on-error error       # txn.bima.error is set when the agent fails -> fail-open
    option set-process-time ptime
    timeout hello 2s
    timeout idle 2m
    timeout processing 100ms        # hard latency budget; on timeout request passes (fail-open)
    # Default frame size is 16384: larger bodies would reach the agent truncated.
    # Must be <= tune.bufsize - 4 (tune.bufsize 65536 in haproxy.cfg).
    max-frame-size 65532
    use-backend be_bima_agents
    log global

# TLS ClientHello fields (JA3) are only present on TLS connections
# (needs `tune.ssl.capture-buffer-size` in global); on plain HTTP they are NULL.
spoe-message check-request
    args id=unique-id src=src method=method path=path query=query ver=req.ver headers=req.hdrs body=req.body tls_ver=ssl_fc_protocol_hello_id tls_ciphers=ssl_fc_cipherlist_bin(1) tls_exts=ssl_fc_extlist_bin(1) tls_curves=ssl_fc_eclist_bin(1) tls_ecpf=ssl_fc_ecformats_bin

spoe-message check-response
    args id=unique-id src=src method=var(txn.method) path=var(txn.path) status=status fp=var(txn.bima.fp)

spoe-group check-request
    messages check-request

spoe-group check-response
    messages check-response
