# Bima behind Cloudflare, with the files generated by
#   bima init --cloudflare-only --cloudflare-account e2eacct
# (written into ./gen by test/e2e/run-cf.sh). Cloudflare is simulated:
#   edge   172.31.77.10  a "Cloudflare edge" (listed in bima-cloudflare.lst) that sends CF-Connecting-IP
#   direct 172.31.77.20  a client hitting the origin directly (must be refused)
#   mockcf               Cloudflare API stand-in (IP lists for ban sync, custom rules)
name: bima-cf
networks:
  cf:
    ipam: {config: [{subnet: 172.31.77.0/24}]}
services:
  haproxy:
    image: haproxy:3.0-alpine
    user: root
    networks: {cf: {ipv4_address: 172.31.77.2}}
    volumes:
      - ./gen/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
      - ./gen/bima-spoe.conf:/etc/haproxy/bima-spoe.conf:ro
      - ./gen/bima-cloudflare.lst:/etc/haproxy/bima-cloudflare.lst:ro
      - ./gen/bima-blocklist.map:/etc/haproxy/bima-blocklist.map:ro
      - run:/var/run/haproxy
    ports: ["127.0.0.1:28201:9101"]
  app:
    image: bima:e2e
    command: ["/usr/local/bin/mockapp"]
    network_mode: "service:haproxy"
  bima:
    image: bima:e2e
    build: {context: ../.., dockerfile: Dockerfile, target: e2e}
    user: root
    network_mode: "service:haproxy"
    command: ["/usr/local/bin/bima", "-config", "/etc/bima/config.yaml"]
    volumes:
      - ./gen/config.yaml:/etc/bima/config.yaml:ro
      - ./gen/bima-cloudflare.lst:/etc/haproxy/bima-cloudflare.lst:ro
      - run:/var/run/haproxy
      - state:/var/lib/bima
    environment:
      BIMA_CLOUDFLARE_API_TOKEN: "cf-test-token"
  mockcf:
    image: bima:e2e
    command: ["/usr/local/bin/mockcf"]
    networks: {cf: {ipv4_address: 172.31.77.30}}
    ports: ["127.0.0.1:28295:8095"]
  edge:
    image: curlimages/curl:8.10.1
    command: ["sleep", "infinity"]
    networks: {cf: {ipv4_address: 172.31.77.10}}
  direct:
    image: curlimages/curl:8.10.1
    command: ["sleep", "infinity"]
    networks: {cf: {ipv4_address: 172.31.77.20}}
volumes: {run: {}, state: {}}
