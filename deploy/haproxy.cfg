# Production template: HAProxy in front of the app, Bima as SPOE agent.
global
    log /dev/log local0 info
    # Runtime API for Bima bans. Bima must reach it (shared volume) — never expose publicly.
    # Bima's user must be in this socket's group (e.g. usermod -aG haproxy bima).
    stats socket /var/run/haproxy/admin.sock mode 660 level admin
    stats timeout 10s
    tune.bufsize 65536           # max request body Bima can inspect (req.body)
    tune.ssl.capture-buffer-size 128   # keep TLS ClientHello for JA3 fingerprints

defaults
    mode http
    log global
    option httplog
    timeout connect 5s
    timeout client 30s
    timeout server 60s
    timeout tarpit 5s

frontend fe_web
    # Directory of combined cert+key PEM files (one per domain); no stray .crt/.key files.
    bind :443 ssl crt /etc/haproxy/certs/ alpn h2,http/1.1
    bind :80
    option http-buffer-request
    unique-id-format %{+X}o\ %ci:%cp_%fi:%fp_%Ts_%rt:%pid
    unique-id-header X-Request-ID

    # If behind a CDN/LB, restore the real client IP — ONLY from trusted ranges:
    # acl from_lb src -f /etc/haproxy/trusted-proxies.lst
    # http-request set-src hdr_ip(x-forwarded-for,-1) if from_lb

    # Layer 0 — native, cheapest checks first
    stick-table type ip size 1m expire 30m store http_req_rate(10s),http_err_rate(60s)
    http-request track-sc0 src
    http-request deny deny_status 403 if { src,map_ip(/etc/haproxy/bima-blocklist.map) -m found }
    http-request deny deny_status 429 if { sc_http_req_rate(0) gt 300 }

    # Layer 1-2 — Bima (fail-open: on agent error/timeout no action var is set)
    http-request set-var(txn.path) path
    http-request set-var(txn.method) method
    filter spoe engine bima config /etc/haproxy/bima-spoe.conf
    http-request send-spoe-group bima check-request
    http-request deny deny_status 403 if { var(txn.bima.action) -m str block }
    http-request tarpit deny_status 429 if { var(txn.bima.action) -m str tarpit }
    http-response send-spoe-group bima check-response
    default_backend be_app

# Prometheus exporter (scrape from your monitoring network only)
frontend fe_stats
    bind :8404
    http-request use-service prometheus-exporter if { path /metrics }
    no log

backend be_app
    server app1 127.0.0.1:8000 check

backend be_bima_agents
    mode tcp
    balance roundrobin
    timeout connect 1s
    timeout server 3m
    server bima1 127.0.0.1:12345 check inter 2s
